<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create a Lobby — Duordle</title>
  <meta name="description" content="Set up your Duordle lobby: word length, player count, rounds, and whether it's public or private." />
  <link rel="canonical" href="https://your-domain-here.example/create-lobby.html" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles/main.css" />
  <link rel="stylesheet" href="/styles/create.css" />
</head>
<body>
  <header class="site-header">
    <div class="logo-mark" aria-hidden="true">
      <span></span><span></span><span></span>
      <span></span><span class="filled-yellow"></span><span></span>
      <span></span><span class="filled-green"></span><span></span>
    </div>
    <span class="site-title">Duordle</span>
  </header>

  <main>
    <nav class="breadcrumbs"><a href="/">Home</a> / Create a lobby</nav>
    <div class="page-container">
      <h1>Create your lobby</h1>

      <div class="field">
        <label for="visibility-select">Lobby visibility</label>
        <select id="visibility-select">
          <option value="public">Public — listed for anyone to join</option>
          <option value="private">Private — joinable only with your lobby ID</option>
        </select>
      </div>

      <div class="field">
        <label for="length-slider">Word length: <span id="length-value">5</span></label>
        <input type="range" id="length-slider" min="3" max="10" step="1" value="5" />
        <div class="hint-text" id="length-joke">that's real deal homie</div>
      </div>

      <div class="field">
        <label for="players-select">Maximum players</label>
        <select id="players-select">
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4" selected>4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
      </div>

      <div class="field">
        <label for="rounds-select">Number of rounds</label>
        <select id="rounds-select">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
        </select>
      </div>

      <div class="field">
        <label for="time-slider">Max time per round: <span id="time-value">3:00</span></label>
        <input type="range" id="time-slider" min="60" max="300" step="15" value="180" />
        <label class="check-row" for="no-time-check">
          <input type="checkbox" id="no-time-check" />
          <span>No time limit (disable the countdown)</span>
        </label>
        <div class="hint-text" id="time-note">When players finish, the remaining time shrinks (last two players get at most 1:00).</div>
      </div>

      <button class="btn" id="create-submit-btn">Create lobby</button>
      <div class="error-text" id="create-error"></div>
    </div>
  </main>

  <footer class="site-footer">
    <span>Duordle</span>
    <a href="/privacy-policy.html">Privacy Policy</a>
  </footer>
  <script>
    (function () {
  const { socket, ensureRegistered, setLobbyId } = window.Duordle;

  const lengthSlider = document.getElementById('length-slider');
  const lengthValue = document.getElementById('length-value');
  const lengthJoke = document.getElementById('length-joke');
  const visibilitySelect = document.getElementById('visibility-select');
  const playersSelect = document.getElementById('players-select');
  const roundsSelect = document.getElementById('rounds-select');
  const timeSlider = document.getElementById('time-slider');
  const timeValue = document.getElementById('time-value');
  const noTimeCheck = document.getElementById('no-time-check');
  const timeNote = document.getElementById('time-note');
  const createSubmitBtn = document.getElementById('create-submit-btn');
  const createError = document.getElementById('create-error');

  // Funny strings as the host drags the letter-count slider.
  const jokes = {
    3: "easy lmao",
    4: "still warming up",
    5: "that's real deal homie",
    6: "okay now we're talking",
    7: "bold choice, champ",
    8: "you sure about this?",
    9: "borderline unhinged",
    10: "son 🙏🏿",
  };

  function updateJoke() {
    const val = Number(lengthSlider.value);
    lengthValue.textContent = val;
    lengthJoke.textContent = jokes[val] || '';
    // Styling lives in create.css (.is-max) - no inline styles from JS.
    lengthJoke.classList.toggle('is-max', val === 10);
  }
  lengthSlider.addEventListener('input', updateJoke);
  updateJoke();

  function updateTime() {
    timeValue.textContent = noTimeCheck.checked
      ? 'No limit'
      : UI.formatTime(Number(timeSlider.value) * 1000);
    timeSlider.disabled = noTimeCheck.checked;
    timeNote.hidden = noTimeCheck.checked;
  }
  timeSlider.addEventListener('input', updateTime);
  noTimeCheck.addEventListener('change', updateTime);
  updateTime();

  ensureRegistered(() => {
    createSubmitBtn.addEventListener('click', () => {
      createSubmitBtn.disabled = true;
      createError.textContent = '';

      const settings = {
        isPublic: visibilitySelect.value === 'public',
        wordLength: Number(lengthSlider.value),
        maxPlayers: Number(playersSelect.value),
        rounds: Number(roundsSelect.value),
        timeLimitSec: noTimeCheck.checked ? 0 : Number(timeSlider.value),
      };

      socket.emit('createLobby', settings, (res) => {
        createSubmitBtn.disabled = false;
        if (!res || !res.ok) {
          createError.textContent = (res && res.error) || 'Could not create lobby.';
          return;
        }
        setLobbyId(res.lobbyId);
        window.location.href = '/lobby.html';
      });
    });
  });
})();

  </script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/scripts/socket-client.js"></script>
  <script src="/scripts/ui.js"></script>
  <script src="/scripts/create.js"></script>
</body>
</html>
