<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join a Lobby — Duordle</title>
  <meta name="description" content="Browse open public Duordle lobbies, filter by player count or word length, or join a private lobby with its 4-character ID." />
  <link rel="canonical" href="https://your-domain-here.example/join-lobby.html" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles/main.css" />
  <link rel="stylesheet" href="/styles/join.css" />
</head>
<body>
  <header class="site-header">
    <div class="logo-mark" aria-hidden="true">
      <span></span><span></span><span></span>
      <span></span><span class="filled-yellow"></span><span></span>
      <span></span><span class="filled-green"></span><span></span>
    </div>
    <span class="site-title">Duordle</span>
  </header>

  <main>
    <nav class="breadcrumbs"><a href="/">Home</a> / Join a lobby</nav>
    <div class="page-container">
      <h1>Join a lobby</h1>

      <div class="filters-row">
        <button class="btn btn-secondary" id="filters-btn" type="button">Filters</button>
        <button class="btn btn-secondary" id="use-id-btn" type="button">Use ID</button>
      </div>

      <div id="filters-box" class="field filters-box pop-panel" hidden>
        <label for="filter-players">Max players</label>
        <select id="filter-players">
          <option value="">Any</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
        <label for="filter-length" class="label-spaced">Word length</label>
        <select id="filter-length">
          <option value="">Any</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
        </select>
        <button class="btn" id="apply-filters-btn">Apply</button>
      </div>

      <ul class="lobby-list" id="lobby-list"></ul>
      <div class="empty-state" id="empty-state" hidden>There's no lobbies</div>
    </div>
  </main>

  <div class="modal-overlay" id="use-id-modal" hidden>
    <div class="modal-box">
      <h2 class="modal-title">Enter lobby ID</h2>
      <div class="field">
        <input type="text" id="lobby-id-input" maxlength="4" autocomplete="off" placeholder="e.g. 9fQ2" class="lobby-id-input" />
      </div>
      <button class="btn" id="submit-id-btn">Join</button>
      <button class="btn btn-secondary" id="cancel-id-btn">Cancel</button>
    </div>
  </div>

  <footer class="site-footer">
    <span>Duordle</span>
    <a href="/privacy-policy.html">Privacy Policy</a>
  </footer>
<script>
  (function () {
  const { socket, ensureRegistered, setLobbyId, escapeHtml } = window.Duordle;

  const lobbyListEl = document.getElementById('lobby-list');
  const emptyStateEl = document.getElementById('empty-state');
  const filtersBtn = document.getElementById('filters-btn');
  const filtersBox = document.getElementById('filters-box');
  const applyFiltersBtn = document.getElementById('apply-filters-btn');
  const filterPlayers = document.getElementById('filter-players');
  const filterLength = document.getElementById('filter-length');

  const useIdBtn = document.getElementById('use-id-btn');
  const useIdModal = document.getElementById('use-id-modal');
  const lobbyIdInput = document.getElementById('lobby-id-input');
  const submitIdBtn = document.getElementById('submit-id-btn');
  const cancelIdBtn = document.getElementById('cancel-id-btn');

  // Messages drop in from the top and disappear after 3 seconds (see ui.js / main.css).
  function showToast(message) {
    UI.toast(message, { duration: 3000 });
  }

  function currentFilters() {
    const filters = {};
    if (filterPlayers.value) filters.maxPlayers = Number(filterPlayers.value);
    if (filterLength.value) filters.wordLength = Number(filterLength.value);
    return filters;
  }

  function renderLobbies(lobbies) {
    lobbyListEl.innerHTML = '';
    if (!lobbies || lobbies.length === 0) {
      emptyStateEl.hidden = false;
      return;
    }
    emptyStateEl.hidden = true;
    for (const lobby of lobbies) {
      const li = document.createElement('li');
      li.className = 'lobby-row';
      li.innerHTML = `
        <span>
          <span class="lobby-id">${escapeHtml(lobby.id)}</span>
          &nbsp;&middot;&nbsp; ${lobby.wordLength}-letter words
          &nbsp;&middot;&nbsp; ${lobby.playerCount}/${lobby.maxPlayers} players
        </span>
        <button class="btn" data-id="${escapeHtml(lobby.id)}">Join</button>
      `;
      lobbyListEl.appendChild(li);
    }
    lobbyListEl.querySelectorAll('button[data-id]').forEach((btn) => {
      btn.addEventListener('click', () => attemptJoin(btn.getAttribute('data-id')));
    });
  }

  function refreshList() {
    socket.emit('listPublicLobbies', currentFilters(), (res) => {
      if (res && res.ok) renderLobbies(res.lobbies);
    });
  }

  function attemptJoin(lobbyId) {
    socket.emit('joinLobby', { lobbyId }, (res) => {
      if (!res || !res.ok) {
        showToast(res && res.error ? res.error : 'Could not join lobby.');
        return;
      }
      setLobbyId(lobbyId);
      window.location.href = '/lobby.html';
    });
  }

  filtersBtn.addEventListener('click', () => {
    // Starts hidden (HTML `hidden` attribute); opens/closes with a short animation.
    if (filtersBox.hidden) UI.show(filtersBox);
    else UI.hide(filtersBox);
  });
  applyFiltersBtn.addEventListener('click', refreshList);

  useIdBtn.addEventListener('click', () => {
    lobbyIdInput.value = '';
    UI.show(useIdModal);
    lobbyIdInput.focus();
  });
  cancelIdBtn.addEventListener('click', () => UI.hide(useIdModal));
  // Enter submits, Escape closes
  lobbyIdInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitIdBtn.click();
    if (e.key === 'Escape') UI.hide(useIdModal);
  });

  submitIdBtn.addEventListener('click', () => {
    const id = lobbyIdInput.value.trim();
    if (id.length !== 4) {
      showToast('Lobby ID must be 4 characters.');
      return;
    }
    attemptJoin(id);
  });

  ensureRegistered(() => {
    refreshList();
    setInterval(refreshList, 4000); // keep the public list reasonably fresh
  });
})();

</script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/scripts/socket-client.js"></script>
  <script src="/scripts/ui.js"></script>
  <script src="/scripts/join.js"></script>
</body>
</html>
